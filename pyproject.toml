[project]
name = "mlx-omni-server"
version = "0.5.0"
description = "MLX Omni Server is a server that provides OpenAI-compatible APIs using Apple's MLX framework."
authors = [{ name = "madroid", email = "madroidmaq@gmail.com" }, { name = "zhutao100", email = "zhutao100@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "mlx",
    "ai",
    "agi",
    "aigc",
    "server",
    "openai",
    "tts",
    "stt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # core
    "fastapi>=0.116.1",
    "pydantic>=2.9.2",
    "uvicorn>=0.34.0",
    "rich>=13.9.4",
    # chat (+ models, responses)
    "mlx-lm @ git+https://github.com/zhutao100/mlx-lm.git@main",
    "mlx-vlm @ git+https://github.com/zhutao100/mlx-vlm.git@main",
    "Pillow>=10.0.0",
    "sse-starlette>=2.1.3",
    "lm-format-enforcer",
    "regex",
    # models
    "huggingface-hub>=0.30",
    # embeddings
    "mlx-embeddings>=0.0.3",
]

[project.optional-dependencies]
images = [
    "mflux>=0.13.0",
]
stt = [
    "python-multipart>=0.0.20",
    "mlx-whisper>=0.4.1",
]
tts = [
    "f5-tts-mlx>=0.2.5",
    "mlx-audio>=0.2.4",
    "numba>=0.57.0",
    "typing-extensions>=4.12.0",
]
weave = [
    "weave>=0.51.46",
]
all = [
    "mflux>=0.13.0",
    "python-multipart>=0.0.20",
    "mlx-whisper>=0.4.1",
    "f5-tts-mlx>=0.2.5",
    "mlx-audio>=0.2.4",
    "numba>=0.57.0",
    "typing-extensions>=4.12.0",
    "weave>=0.51.46",
]

[project.urls]
Repository = "https://github.com/zhutao100/mlx-omni-server"

[project.scripts]
mlx-omni-server = "mlx_omni_server.main:start"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "pre-commit>=4.0.1",
    "black>=24.10.0",
    "isort>=5.13.2",
    "weave>=0.51.46",
    "openai>=1.78.0",
    # for en_core_web_sm models
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/mlx_omni_server"]

[tool.hatch.build.targets.wheel]
include = ["src/mlx_omni_server"]

[tool.hatch.build.targets.wheel.sources]
"src/mlx_omni_server" = "mlx_omni_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
